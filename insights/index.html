<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOT 傾向ビュー</title>
<link rel="stylesheet" href="./insights.css?v=1">
</head>
<body>
<header class="app-header">
  <a class="back-link" href="../index.html">戻る</a>
  <div>
    <div class="kicker">SLOT INSIGHTS</div>
    <h1>傾向ビュー</h1>
  </div>
  <button class="load-btn" id="reloadBtn" type="button">再読込</button>
</header>

<main>
  <section class="hero-panel">
    <div>
      <p class="hero-copy">集めたデータから、店がいつ・どこ・何を強く扱っているかを読む画面です。</p>
      <div class="status-line" id="statusLine">データ読込中...</div>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <section class="snapshot-panel" id="snapshotView"></section>

  <section class="control-panel">
    <label>
      <span>店舗</span>
      <select id="storeSelect"></select>
    </label>
    <label>
      <span>表示</span>
      <select id="scopeSelect">
        <option value="overview">全体を見る</option>
        <option value="store">選択店舗を掘る</option>
      </select>
    </label>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>01</span>
        <h2>鮮度</h2>
      </div>
      <p>古い店は薄く見る。</p>
    </div>
    <div id="freshnessView"></div>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>02</span>
        <h2>店の勢い</h2>
      </div>
      <p>直近30日、前30日比、勝率、件数を同時に見ます。</p>
    </div>
    <div id="storeMomentumView"></div>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>03</span>
        <h2>タイミングの癖</h2>
      </div>
      <p>日付、曜日、末尾、組合せの偏りを表示します。</p>
    </div>
    <div id="timingView"></div>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>04</span>
        <h2>機種の扱い変化</h2>
      </div>
      <p>今月と前期間の差を、件数と一緒に読みます。</p>
    </div>
    <div id="modelView"></div>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>05</span>
        <h2>台番帯・場所傾向</h2>
      </div>
      <p>台番を当てるのではなく、使われやすい帯を探します。</p>
    </div>
    <div id="bandView"></div>
  </section>

  <section class="section-block compact">
    <div class="section-head">
      <div>
        <span>06</span>
        <h2>LINE店舗</h2>
      </div>
      <p>差枚なしデータは別枠で蓄積状態だけ見ます。</p>
    </div>
    <div id="lineView"></div>
  </section>
</main>

<script src="./insights.js?v=1"></script>
</body>
</html>
