<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOT 傾向ビュー</title>
<link rel="stylesheet" href="./insights.css?v=1">
</head>
<body>
<header class="app-header">
  <a class="back-link" href="../index.html">戻る</a>
  <div>
    <div class="kicker">SLOT INSIGHTS</div>
    <h1>傾向ビュー</h1>
  </div>
  <button class="load-btn" id="reloadBtn" type="button">再読込</button>
</header>

<main>
  <section class="hero-panel">
    <div>
      <p class="hero-copy">まずは鶴見UNOとエスパスだけ。過去データから、店ごとの狙い筋を順番に絞ります。</p>
      <div class="status-line" id="statusLine">データ読込中...</div>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <section class="store-switch-panel" id="storeSwitch"></section>

  <section class="snapshot-panel" id="snapshotView"></section>

  <nav class="section-nav" aria-label="分析ビュー">
    <a href="#snapshotView">狙い筋</a>
    <a href="#momentumSection">店状態</a>
    <a href="#modelSection">機種</a>
    <a href="#timingSection">癖</a>
    <a href="#bandSection">場所</a>
    <a href="#freshnessSection">鮮度</a>
  </nav>

  <section class="section-block compact" id="momentumSection">
    <div class="section-head">
      <div>
        <span>01</span>
        <h2>店の状態</h2>
      </div>
      <p>選択中の店を深掘りする。</p>
    </div>
    <div id="storeMomentumView"></div>
  </section>

  <section class="section-block compact" id="modelSection">
    <div class="section-head">
      <div>
        <span>02</span>
        <h2>機種</h2>
      </div>
      <p>店ごとの扱い変化を見る。</p>
    </div>
    <div id="modelView"></div>
  </section>

  <section class="section-block compact" id="timingSection">
    <div class="section-head">
      <div>
        <span>03</span>
        <h2>タイミングの癖</h2>
      </div>
      <p>日付、曜日、末尾、組合せの偏りを表示します。</p>
    </div>
    <div id="timingView"></div>
  </section>

  <section class="section-block compact" id="bandSection">
    <div class="section-head">
      <div>
        <span>04</span>
        <h2>場所</h2>
      </div>
      <p>台番帯と場所の偏りを見る。</p>
    </div>
    <div id="bandView"></div>
  </section>

  <section class="section-block compact" id="freshnessSection">
    <div class="section-head">
      <div>
        <span>05</span>
        <h2>鮮度</h2>
      </div>
      <p>古い店は薄く見る。</p>
    </div>
    <div id="freshnessView"></div>
  </section>
</main>

<script src="./insights.js?v=1"></script>
</body>
</html>
