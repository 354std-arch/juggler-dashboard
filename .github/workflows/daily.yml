name: Validation

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pandas

      - name: Python syntax check
        run: python -m py_compile scrape_juggler.py compute.py morning_compute.py candidate_compute.py

      - name: JavaScript syntax check
        run: node -e "const fs=require('fs');new Function(fs.readFileSync('app.js','utf8'));console.log('app.js syntax OK')"

      - name: JSON sanity check
        run: |
          python - <<'PY'
          import json
          for path in ['data.json', 'morning_data.json', 'candidate_data.json', 'seat_data.json', 'store_list.json']:
              with open(path, encoding='utf-8-sig') as f:
                  json.load(f)
              print(f'{path} OK')
          PY
